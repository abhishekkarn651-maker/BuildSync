name: BuildSync Continuous Integration (CI)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend CI (Java 17 / Spring Boot 3 / PostgreSQL Schema / Unit & Integration Tests)
  # ----------------------------------------------------------------------------
  backend-test-and-package:
    name: Backend Regression & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./backend/mvnw

      - name: Execute Backend Tests & Package Archive
        run: ./backend/mvnw -f backend/pom.xml clean test package
        env:
          SPRING_PROFILES_ACTIVE: default

  # ----------------------------------------------------------------------------
  # Job 2: Frontend CI (Node 20 / Next.js 16 / TypeScript / ESLint / Webpack Build)
  # ----------------------------------------------------------------------------
  frontend-lint-and-build:
    name: Frontend Quality & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint Verification
        run: npm run lint
        working-directory: ./frontend

      - name: Execute Next.js Production Build
        run: npm run build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

