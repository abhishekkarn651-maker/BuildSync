spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:h2:mem:buildsynctest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

server:
  port: 8080

buildsync:
  cors:
    allowed-origins: http://localhost:3000
  security:
    jwt:
      secret: test-only-jwt-secret-key-at-least-256-bits-long-32-bytes!
      expiration-seconds: 900
    cookie:
      secure: false
      same-site: Lax
    refresh-token:
      normal-days: 7
      remember-me-days: 30
  storage:
    upload-dir: target/test-uploads
    avatar-dir: avatars
    max-file-size-bytes: 5242880
    min-dimension: 32
    max-dimension: 4096
  github:
    app-client-id: test-github-client-id
    app-client-secret: test-github-client-secret
    callback-url: http://localhost:8080/api/v1/integrations/github/callback
    frontend-redirect-url: http://localhost:3000/settings/integrations/github
    token-encryption-key: test-encryption-key-32-bytes-long!!
    api-base-url: http://localhost:8089/github-api
    oauth-base-url: http://localhost:8089/github-oauth
  rate-limit:
    enabled: false
    storage: memory
    trusted-proxy-enabled: false
